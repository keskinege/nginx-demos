# Import the AI proxy NJS module (its own imports of cache.js/embeddings.js
# resolve relative to /etc/njs automatically)
js_import /etc/njs/aiproxy.js;

# Shared dictionary for semantic cache.
# Sizing: each entry holds a ~10-16KB embedding (JSON float array) plus the
# upstream response body, so ~20KB per entry is a safe planning figure.
# 32M holds ~1500 entries, comfortably above 2 models x max_entries=500.
# NOTE: `evict` is deliberately NOT enabled — njs eviction removes arbitrary
# oldest keys and could corrupt the {model}:entries/{model}:seq index keys.
# Instead, writes are best-effort (SharedMemoryError is caught and logged in
# cache.js) and capacity is enforced by the NJS LRU logic itself.
js_shared_dict_zone zone=ai_cache:32M;
subrequest_output_buffer_size 512k;

# Declare variable to hold RBAC configuration
js_var $ai_proxy_config "";
# Declare variables for token tracking
js_var $ai_proxy_response_prompt_tokens "";
js_var $ai_proxy_response_completion_tokens "";
js_var $ai_proxy_response_total_tokens "";

# Prefer Docker's embedded DNS (present on user-defined networks, e.g.
# `docker compose`); fall back to 8.8.8.8 for plain `docker run` on the
# default bridge where 127.0.0.11 does not exist (refused → next server).
# ipv6=off: containers here have no IPv6 egress to upstream APIs.
resolver 127.0.0.11 8.8.8.8 valid=60s ipv6=off;

upstream openai {
    zone openai 64k;
    server api.openai.com:443 resolve;
}

upstream anthropic {
    zone anthropic 64k;
    server api.anthropic.com:443 resolve;
}

upstream ollama {
    zone ollama 64k;
    include /etc/nginx-ai-proxy/keys/ollama-upstream.conf;
}

server {
    listen 4242;
    default_type application/json;
    js_set $ai_proxy_config aiproxy.load_rbac;

    location  /v1/chat/completions {
        js_content aiproxy.route;
    }

    # Internal locations
    # Those locations are not public
    location /openai {
        internal;

        rewrite ^ /v1/chat/completions;
        break;

        proxy_pass_request_headers off;

        proxy_set_header Host "api.openai.com";
        proxy_set_header Content-Type "application/json";

        include /etc/nginx-ai-proxy/keys/openai-key.conf; # set OpenAI API key

        proxy_method POST;
        proxy_pass https://openai;

        proxy_ssl_verify on;
        proxy_ssl_server_name on;
        proxy_ssl_name "api.openai.com";
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    }

    location /anthropic {
        internal;

        rewrite ^ /v1/messages;
        break;

        proxy_pass_request_headers off;

        proxy_set_header Host "api.anthropic.com";
        proxy_set_header Content-Type "application/json";
        proxy_set_header anthropic-version "2023-06-01"; # required by Anthropic API

        include /etc/nginx-ai-proxy/keys/anthropic-key.conf; # set Anthropic API key

        proxy_method POST;
        proxy_pass https://anthropic;

        proxy_ssl_verify on;
        proxy_ssl_server_name on;
        proxy_ssl_name "api.anthropic.com";
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    }

    location /ollama-embedding {
        internal;

        rewrite ^ /api/embeddings;
        break;

        proxy_pass_request_headers off;

        proxy_set_header Content-Type "application/json";

        proxy_method POST;
        proxy_pass http://ollama;

        proxy_buffer_size 1m;
        proxy_buffers 8 1m;
        proxy_busy_buffers_size 2m;
    }

    location /openai-embedding {
        internal;

        rewrite ^ /v1/embeddings;
        break;

        proxy_pass_request_headers off;

        proxy_set_header Host "api.openai.com";
        proxy_set_header Content-Type "application/json";

        include /etc/nginx-ai-proxy/keys/openai-key.conf;

        proxy_method POST;
        proxy_pass https://openai;

        proxy_ssl_verify on;
        proxy_ssl_server_name on;
        proxy_ssl_name "api.openai.com";
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    }
}
